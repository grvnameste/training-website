stages:
  - verify
  - build

default:
  image: node:22
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
      - node_modules/

install:
  stage: verify
  script:
    - npm ci --cache .npm --prefer-offline
  artifacts:
    paths:
      - node_modules/
    expire_in: 1 day

typecheck:
  stage: verify
  needs: [install]
  script:
    - npm run typecheck

invariants:
  stage: verify
  needs: [install]
  script:
    - npm run check:invariants

integration:
  stage: verify
  needs: [install]
  services:
    - name: postgres:17
      alias: postgres
  variables:
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    POSTGRES_DB: readnrevise_test
    DATABASE_URL: postgresql://postgres:postgres@postgres:5432/readnrevise_test
    TEST_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/readnrevise_test
    ALLOW_REMOTE_TEST_DB: "1"
  script:
    - npm run test:db:setup
    - npm run test:integration

build:
  stage: build
  needs: [install]
  variables:
    DATABASE_URL: postgresql://postgres:postgres@localhost:5432/readnrevise
    SESSION_SECRET: build-only-session-secret-not-used-at-runtime
  script:
    - npm run build
